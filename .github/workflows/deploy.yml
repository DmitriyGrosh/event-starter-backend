name: Build and Deploy to VPS

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/event-starter-backend

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image build summary
        run: |
          echo "✅ Image built and pushed successfully!"
          echo "📦 Image tags: ${{ steps.meta.outputs.tags }}"
          echo "🔖 Image digest: ${{ steps.build.outputs.digest }}"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e  # Exit on any error
            
            echo "🚀 Starting deployment process..."
            
            # Create deployment directory if it doesn't exist
            mkdir -p ~/event-starter-backend
            cd ~/event-starter-backend

            # Install curl if not available (for testing connectivity)
            if ! command -v curl &> /dev/null; then
              echo "📦 Installing curl..."
              apt-get update && apt-get install -y curl
            fi

            # Determine the image tag to use
            IMAGE_TAG="${{ github.sha }}"
            FULL_IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${IMAGE_TAG}"
            
            echo "🏷️ Using image: ${FULL_IMAGE_NAME}"

            # Create docker-compose.prod.yml
            echo "📝 Creating docker-compose configuration..."
            cat > docker-compose.prod.yml << 'COMPOSE_EOF'
            version: '3.8'

            services:
              app:
                image: ${DOCKER_IMAGE_NAME:-event-starter-backend}:${DOCKER_IMAGE_TAG:-latest}
                ports:
                  - "5002:5002"
                environment:
                  - NODE_ENV=production
                  - PORT=5002
                  - POSTGRES_USER=${POSTGRES_USER}
                  - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                  - POSTGRES_DB=${POSTGRES_DB}
                  - POSTGRES_HOST=${POSTGRES_HOST:-localhost}
                  - POSTGRES_PORT=${POSTGRES_PORT:-5432}
                  - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-event_db}?schema=public
                  - JWT_SECRET=${JWT_SECRET}
                  - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
                  - SMTP_HOST=${SMTP_HOST}
                  - SMTP_PORT=${SMTP_PORT}
                  - SMTP_SECURE=${SMTP_SECURE}
                  - SMTP_USER=${SMTP_USER}
                  - SMTP_PASS=${SMTP_PASS}
                  - SMTP_FROM=${SMTP_FROM}
                restart: unless-stopped
                network_mode: host
            COMPOSE_EOF

            # Create .env file from GitHub secrets and variables
            echo "📝 Creating environment configuration..."
            cat > .env << 'ENV_EOF'
            # Docker Configuration
            DOCKER_IMAGE_NAME=${{ env.REGISTRY }}/${{ github.repository_owner }}/event-starter-backend
            DOCKER_IMAGE_TAG=main-${{ github.sha }}
            
            # Database Configuration
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ vars.POSTGRES_DB || 'event_db' }}
            POSTGRES_HOST=${{ vars.POSTGRES_HOST || 'localhost' }}
            POSTGRES_PORT=${{ vars.POSTGRES_PORT || '5432' }}
            
            # JWT Configuration
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN || '7d' }}
            
            # SMTP Configuration
            SMTP_HOST=${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
            SMTP_PORT=${{ vars.SMTP_PORT || '587' }}
            SMTP_SECURE=${{ vars.SMTP_SECURE || 'false' }}
            SMTP_USER=${{ secrets.SMTP_USER || '' }}
            SMTP_PASS=${{ secrets.SMTP_PASS || '' }}
            SMTP_FROM=${{ vars.SMTP_FROM || 'noreply@example.com' }}
            
            # Server Configuration
            NODE_ENV=production
            PORT=5002
            ENV_EOF

            # Validate critical environment variables
            echo "🔍 Validating environment..."
            if [ -z "${{ secrets.POSTGRES_USER }}" ] || [ -z "${{ secrets.POSTGRES_PASSWORD }}" ]; then
              echo "❌ Database credentials are missing!"
              exit 1
            fi
            
            if [ -z "${{ secrets.JWT_SECRET }}" ]; then
              echo "❌ JWT_SECRET is missing!"
              exit 1
            fi

            # Login to GitHub Container Registry
            echo "🔐 Logging into container registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull the latest image
            echo "📦 Pulling Docker image..."
            docker pull "${FULL_IMAGE_NAME}"

            # Run database migrations
            echo "🔄 Running database migrations..."
            docker run --rm \
              --env-file .env \
              --network host \
              "${FULL_IMAGE_NAME}" \
              sh -c "pnpm run db:migrate:deploy"

            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down || true

            # Start new containers
            echo "🚀 Starting new containers..."
            docker compose -f docker-compose.prod.yml up -d

            # Wait a moment for containers to start
            sleep 5

            # Verify deployment
            echo "✅ Verifying deployment..."
            if docker compose -f docker-compose.prod.yml ps | grep -q "Up"; then
              echo "✅ Containers are running!"
              docker compose -f docker-compose.prod.yml ps
            else
              echo "❌ Container failed to start!"
              docker compose -f docker-compose.prod.yml logs app
              exit 1
            fi

            # Test backend connectivity
            echo "🧪 Testing backend connectivity..."
            if curl -f --max-time 10 http://localhost:5002 > /dev/null 2>&1; then
              echo "✅ Backend is responding!"
            else
              echo "⚠️ Backend might not be ready yet (this could be normal)"
            fi

            # Show recent logs
            echo "📋 Recent application logs:"
            docker compose -f docker-compose.prod.yml logs --tail=10 app

            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "🎉 Deployment completed successfully!" 