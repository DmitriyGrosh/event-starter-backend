name: Deploy to VPS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/event-starter-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Create deployment directory
            mkdir -p ~/event-starter-backend
            cd ~/event-starter-backend

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Convert repository name to lowercase for Docker
            REPO="${{ github.repository_owner }}/event-starter-backend"
            REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="ghcr.io/$REPO_LOWER:main"
            
            echo "Debug: REPO=$REPO"
            echo "Debug: REPO_LOWER=$REPO_LOWER"
            echo "Debug: IMAGE_NAME=$IMAGE_NAME"
            
            # Export the variables so they're available to docker-compose
            export REPO_LOWER
            export IMAGE_NAME
            
            # Create docker-compose.yml
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              app:
                container_name: event-starter-backend
                image: ${IMAGE_NAME}
                environment:
                  - NODE_ENV=production
                  - PORT=5002
                  - POSTGRES_USER=${POSTGRES_USER}
                  - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                  - POSTGRES_DB=${POSTGRES_DB:-event_db}
                  - POSTGRES_HOST=localhost
                  - POSTGRES_PORT=5432
                  - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB:-event_db}?schema=public
                  - JWT_SECRET=${JWT_SECRET}
                  - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
                  - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
                  - SMTP_PORT=${SMTP_PORT:-587}
                  - SMTP_SECURE=${SMTP_SECURE:-false}
                  - SMTP_USER=${SMTP_USER}
                  - SMTP_PASS=${SMTP_PASS}
                  - SMTP_FROM=${SMTP_FROM:-noreply@example.com}
                ports:
                  - "5002:5002"
                restart: unless-stopped
            EOF

            # Create .env file
            cat > .env << 'ENV_EOF'
            # Database Configuration
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ vars.POSTGRES_DB || 'event_db' }}
            POSTGRES_HOST=localhost
            POSTGRES_PORT=5432
            
            # JWT Configuration
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN || '7d' }}
            
            # SMTP Configuration
            SMTP_HOST=${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
            SMTP_PORT=${{ vars.SMTP_PORT || '587' }}
            SMTP_SECURE=${{ vars.SMTP_SECURE || 'false' }}
            SMTP_USER=${{ secrets.SMTP_USER || '' }}
            SMTP_PASS=${{ secrets.SMTP_PASS || '' }}
            SMTP_FROM=${{ vars.SMTP_FROM || 'noreply@example.com' }}
            ENV_EOF

            # Check if PostgreSQL is accessible
            echo "Checking PostgreSQL connection on host..."
            if ! nc -z localhost 5432; then
              echo "❌ Cannot connect to PostgreSQL on host machine"
              echo "Please ensure PostgreSQL is running and accessible"
              exit 1
            fi

            # Pull the latest image
            echo "Pulling image: $IMAGE_NAME"
            docker pull "$IMAGE_NAME"

            # Stop and remove old containers
            docker compose down || true

            # Start the new deployment
            docker compose up -d

            # Wait for the application to be ready
            echo "Waiting for application to start..."
            for i in {1..30}; do
              if curl -s http://localhost:5002/health >/dev/null; then
                echo "Application is ready!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            # Show detailed logs
            echo "=== Application Logs ==="
            docker compose logs app

            # Show container status
            echo "=== Container Status ==="
            docker compose ps

            # Test PostgreSQL connection from container
            echo "=== Testing Database Connection ==="
            docker compose exec app nc -zv localhost 5432 || echo "Cannot connect to PostgreSQL"

            # Clean up old images
            docker image prune -f 