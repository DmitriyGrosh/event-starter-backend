name: Deploy to VPS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/event-starter-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Create deployment directory
            mkdir -p ~/event-starter-backend
            cd ~/event-starter-backend

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Convert repository name to lowercase for Docker
            REPO="${{ github.repository_owner }}/event-starter-backend"
            REPO_LOWER=$(echo $REPO | tr '[:upper:]' '[:lower:]')

            # Create docker-compose.yml
            cat > docker-compose.yml << 'EOF'
            version: '3.8'

            services:
              app:
                image: ${{ env.REGISTRY }}/${REPO_LOWER}:main
                ports:
                  - "5002:5002"
                environment:
                  - NODE_ENV=production
                  - PORT=5002
                  - POSTGRES_USER=${POSTGRES_USER}
                  - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                  - POSTGRES_DB=${POSTGRES_DB:-event_db}
                  - POSTGRES_HOST=${POSTGRES_HOST:-localhost}
                  - POSTGRES_PORT=${POSTGRES_PORT:-5432}
                  - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-event_db}?schema=public
                  - JWT_SECRET=${JWT_SECRET}
                  - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
                  - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
                  - SMTP_PORT=${SMTP_PORT:-587}
                  - SMTP_SECURE=${SMTP_SECURE:-false}
                  - SMTP_USER=${SMTP_USER}
                  - SMTP_PASS=${SMTP_PASS}
                  - SMTP_FROM=${SMTP_FROM:-noreply@example.com}
                restart: unless-stopped
                network_mode: host
            EOF

            # Create .env file
            cat > .env << 'ENV_EOF'
            # Database Configuration
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ vars.POSTGRES_DB || 'event_db' }}
            POSTGRES_HOST=${{ vars.POSTGRES_HOST || 'localhost' }}
            POSTGRES_PORT=${{ vars.POSTGRES_PORT || '5432' }}
            
            # JWT Configuration
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN || '7d' }}
            
            # SMTP Configuration
            SMTP_HOST=${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
            SMTP_PORT=${{ vars.SMTP_PORT || '587' }}
            SMTP_SECURE=${{ vars.SMTP_SECURE || 'false' }}
            SMTP_USER=${{ secrets.SMTP_USER || '' }}
            SMTP_PASS=${{ secrets.SMTP_PASS || '' }}
            SMTP_FROM=${{ vars.SMTP_FROM || 'noreply@example.com' }}
            ENV_EOF

            # Validate critical environment variables
            if [ -z "${{ secrets.POSTGRES_USER }}" ] || [ -z "${{ secrets.POSTGRES_PASSWORD }}" ]; then
              echo "❌ Database credentials are missing!"
              exit 1
            fi
            
            if [ -z "${{ secrets.JWT_SECRET }}" ]; then
              echo "❌ JWT_SECRET is missing!"
              exit 1
            fi

            # Pull the latest images
            docker compose pull

            # Stop and remove old containers
            docker compose down || true

            # Run database migrations
            docker compose run --rm app sh -c "pnpm run db:migrate:deploy"

            # Start the new deployment
            docker compose up -d

            # Wait a moment for services to start
            sleep 10

            # Check deployment status
            echo "=== Deployment Status ==="
            docker compose ps

            # Show recent logs
            echo "=== Application Logs ==="
            docker compose logs app --tail=20

            # Clean up old images
            docker image prune -f 